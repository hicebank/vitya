name: Python package

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:

    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.14.10']

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements.txt
        python -m pip wheel . --no-deps --wheel-dir "$RUNNER_TEMP/dist"
        python -m pip install --no-deps "$RUNNER_TEMP"/dist/vitya-*.whl
        python -m pip check
    - name: Lint with flake8
      run: |
        flake8 --max-line-length=127 vitya/ tests/
    - name: Check isort
      run: |
        isort -c vitya/ tests/
    - name: Test the installed wheel
      run: |
        cp -R tests "$RUNNER_TEMP/tests"
        cd "$RUNNER_TEMP"
        python -c "import vitya.pydantic_fields, vitya.error_description, vitya.payment_order.payments.checkers"
        python -m pytest tests
    - name: Test with mypy
      run: |
        mypy --config-file mypy.ini --strict ${{ matrix.python-version == '3.14.10' && '--always-true' || '--always-false' }} PYDANTIC_V2 -p vitya
